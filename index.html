<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Porodično Stablo | Porodica Marković</title>
  <meta name="description" content="Interaktivno porodično stablo porodice Marković sa prikazom hijerarhije, filtriranjem i pretragom." />
  <meta name="author" content="Nikola Marković" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Application Styles -->
  <link rel="stylesheet" href="assets/css/app.css" />

  <!-- D3.js v6 for Sunburst view -->
  <script src="assets/js/d3.v6.min.js"></script>
</head>
<body>

  <div id="app-container">
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="brand-section">
        <div class="brand-logo">🌳</div>
        <div class="brand-title">
          <h1>Porodično Stablo</h1>
          <p>Porodica Marković</p>
        </div>
      </div>

      <!-- Live Search Bar -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="Pretraži člana (ime, godina, partner...)" autocomplete="off" />
          <button id="search-clear-btn" class="search-clear-btn" title="Očisti pretragu">✕</button>
        </div>
        <div id="search-results" class="search-results-dropdown"></div>
      </div>

      <!-- Header Controls & Filters -->
      <div class="header-controls">
        <!-- View Mode Selector -->
        <div class="view-mode-tabs">
          <button class="view-tab-btn active" data-view="tree" title="Hijerarhijski prikaz stabla">
            <span>🌳</span> Stablo
          </button>
          <button class="view-tab-btn" data-view="sunburst" title="Prstenasti prikaz godova">
            <span>⭕</span> Godovi
          </button>
          <button class="view-tab-btn" data-view="table" title="Tabelarni prikaz">
            <span>📋</span> Tabela
          </button>
        </div>

        <!-- Filter for hiding females -->
        <label class="toggle-switch-wrapper" title="Filtriraj prikaz na samo muške potomke">
          <span class="toggle-label-text">Samo muška linija</span>
          <input type="checkbox" id="female-filter-checkbox" class="toggle-checkbox" />
          <span class="toggle-switch"></span>
        </label>

        <!-- Action Buttons -->
        <button id="export-json-btn" class="action-btn primary" title="Preuzmi ažurirani drvo.json fajl">
          <span>💾</span> Preuzmi drvo.json
        </button>
        <button id="reset-data-btn" class="action-btn" title="Resetuj na originalne podatke">
          <span>🔄</span> Resetuj
        </button>
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="main-viewport">
      <!-- Tree View Container -->
      <div id="tree-view-container" class="tree-canvas-container"></div>

      <!-- Sunburst Godovi View Container -->
      <div id="sunburst-view-container" class="sunburst-view-container"></div>

      <!-- Table View Container -->
      <div id="table-view-container" class="table-view-container"></div>

      <!-- Floating Zoom Controls -->
      <div class="zoom-toolbar">
        <button id="zoom-in-btn" class="zoom-btn" title="Uvećaj (Zoom In)">+</button>
        <button id="zoom-out-btn" class="zoom-btn" title="Umanji (Zoom Out)">−</button>
        <button id="zoom-reset-btn" class="zoom-btn" title="Centriraj stablo">🎯</button>
      </div>

      <!-- Stats Bar Pill -->
      <div class="stats-bar">
        <div class="stat-item">
          <span>Ukupno:</span>
          <span id="stat-total" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span>Muškarci:</span>
          <span id="stat-males" class="stat-value" style="color: var(--male-color);">0</span>
        </div>
        <div class="stat-item">
          <span>Žene:</span>
          <span id="stat-females" class="stat-value" style="color: var(--female-color);">0</span>
        </div>
        <div class="stat-item">
          <span>Generacije:</span>
          <span id="stat-gens" class="stat-value" style="color: var(--accent-gold);">0</span>
        </div>
      </div>

      <!-- Person Profile Detail Drawer -->
      <aside id="detail-drawer" class="detail-drawer">
        <div class="drawer-header">
          <h3>Profil članа</h3>
          <button id="drawer-close-btn" class="drawer-close-btn">✕</button>
        </div>

        <div class="drawer-body">
          <div class="profile-card-top">
            <img id="drawer-photo" class="profile-photo" src="assets/img/osoba.jpg" alt="Foto" />
            <h2 id="drawer-name" class="profile-name">Ime Prezime</h2>
            <span id="drawer-badge" class="profile-badge male">Muški član</span>
          </div>

          <div class="info-grid">
            <div class="info-box">
              <div class="info-label">Godina rođenja</div>
              <div id="drawer-od" class="info-val">-</div>
            </div>
            <div class="info-box">
              <div class="info-label">Mesto rođenja</div>
              <div id="drawer-mr" class="info-val">-</div>
            </div>
            <div class="info-box">
              <div class="info-label">Godina smrti</div>
              <div id="drawer-do" class="info-val">-</div>
            </div>
            <div class="info-box">
              <div class="info-label">Mesto smrti</div>
              <div id="drawer-ms" class="info-val">-</div>
            </div>
            <div class="info-box full-width">
              <div class="info-label">Bračni partner</div>
              <div id="drawer-brak" class="info-val">-</div>
            </div>
            <div class="info-box">
              <div class="info-label">Mobilni</div>
              <div id="drawer-mob" class="info-val">-</div>
            </div>
            <div class="info-box">
              <div class="info-label">Email</div>
              <div id="drawer-email" class="info-val">-</div>
            </div>
            <div class="info-box full-width" id="drawer-social-box" style="display: none;">
              <div class="info-label">Web & Društvene mreže</div>
              <div id="drawer-social-links" class="drawer-social-links"></div>
            </div>
            <div class="info-box full-width">
              <div class="info-label">Biografija</div>
              <div id="drawer-bio" class="info-val" style="font-weight: 400; line-height: 1.5;">-</div>
            </div>
          </div>
        </div>

        <div class="drawer-actions">
          <button id="drawer-add-child-btn" class="action-btn primary">➕ Dodaj dete</button>
          <button id="drawer-edit-btn" class="action-btn">✏️ Izmeni</button>
          <button id="drawer-delete-btn" class="action-btn danger">🗑️</button>
        </div>
      </aside>
    </main>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-window">
      <div class="modal-header">
        <h3 id="modal-title">Naslov modala</h3>
        <button id="modal-close-btn" class="modal-close-btn">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Main JavaScript App Entry -->
  <script type="module" src="assets/js/app.js"></script>

</body>
</html>
